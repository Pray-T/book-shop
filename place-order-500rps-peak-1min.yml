config:
  target: "http://localhost:8080"

  phases:
    - duration: 60
      arrivalRate: 250
      name: "reserve 500 RPS immediate burst"

scenarios:
  - name: "create order then reserve - immediate burst"
    flow:
      - post:
          url: "/api/createOrder"
          json:
            usePoint: 0
            priceAmount: 30000
            userId: 1
            orderItems:
              - bookId: 1
                quantity: 2
              - bookId: 2
                quantity: 1
          capture:
            - json: "$.orderId"
              as: "orderId"

      - post:
          url: "/api/placeOrder"
          json:
            orderId: "{{ orderId }}"