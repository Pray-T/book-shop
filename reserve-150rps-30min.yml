config:
  target: "http://localhost:8080"

  phases:
    - duration: 60
      arrivalRate: 10
      rampTo: 75
      name: "reserve 150 RPS ramp up"

    - duration: 1620
      arrivalRate: 75
      name: "reserve 150 RPS sustained"

    - duration: 60
      arrivalRate: 75
      rampTo: 10
      name: "reserve 150 RPS ramp down"

    - duration: 60
      arrivalRate: 10
      name: "reserve recovery"

scenarios:
  - name: "create order then reserve"
    flow:
      - post:
          url: "/api/createOrder"
          json:
            usePoint: 0
            priceAmount: 30000
            userId: 1
            orderItems:
              - bookId: 1
                quantity: 2
              - bookId: 2
                quantity: 1
          capture:
            - json: "$.orderId"
              as: "orderId"

      - post:
          url: "/api/reserve"
          json:
            orderId: "{{ orderId }}"